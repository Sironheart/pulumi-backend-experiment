name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ forgejo.token }}

      - uses: https://code.forgejo.org/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # github-action-svu is unusable: its action.yaml has a typo (`descrription`)
      # that forgejo-runner's strict schema validation rejects; unfixed upstream.
      - name: Determine release version
        id: version
        run: |
          go install github.com/caarlos0/svu/v3@v3.4.1
          current="$(svu current)"
          next="$(svu next --always)"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ "$next" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # reruns of a partially failed release must not fail on an existing tag
            if git rev-parse --verify --quiet "refs/tags/$next" >/dev/null; then
              echo "tag $next already exists, skipping tag creation"
            else
              git tag "$next"
              git push origin "refs/tags/$next"
            fi
          fi

      - name: Log in to Forgejo container registry
        if: steps.version.outputs.changed == 'true'
        uses: https://code.forgejo.org/docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: https://forgejo.siron.casa
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build and publish release
        if: steps.version.outputs.changed == 'true'
        uses: https://github.com/goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "2.18.1"
          args: release --clean --parallelism 1
        env:
          GITEA_TOKEN: ${{ forgejo.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.next }}
          GOMEMLIMIT: 2GiB
