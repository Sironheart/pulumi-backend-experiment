name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  MISE_CONFIG_DIR: ${{ forgejo.workspace }}/.tmp/mise-config
  MISE_AUTO_INSTALL: "false"
  GOCACHE: ${{ forgejo.workspace }}/.tmp/go-build
  GOMODCACHE: ${{ forgejo.workspace }}/.tmp/go-mod

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.forgejo/workflows/validation.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ forgejo.token }}

      - uses: https://code.forgejo.org/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('mise.lock', '**/go.sum') }}

      - uses: https://github.com/jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.13"
          install_args: --locked go goreleaser svu syft
          github_token: ""

      - name: Determine release version
        id: version
        run: |
          current="$(svu current)"
          next="$(svu next --always)"
          if git rev-parse --verify --quiet "refs/tags/$current" >/dev/null && \
            [ "$(git rev-list -n 1 "$current")" = "$(git rev-parse HEAD)" ]; then
            echo "release=$current" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$next" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=$next" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        if: steps.version.outputs.changed == 'true' && steps.version.outputs.tag_exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.release }}"
          git push origin "refs/tags/${{ steps.version.outputs.release }}"

      - name: Log in to Forgejo container registry
        if: steps.version.outputs.changed == 'true'
        uses: https://code.forgejo.org/docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: https://forgejo.siron.casa
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build and publish release
        if: steps.version.outputs.changed == 'true'
        run: goreleaser release --clean --parallelism 1
        env:
          GITEA_TOKEN: ${{ forgejo.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.release }}
          GOMEMLIMIT: 2GiB
